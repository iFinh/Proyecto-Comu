; --- TRONCAL PJSIP HACIA SEDE B ---
[troncal-sede-b]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw,alaw
aors=troncal-sede-b
direct_media=no

[troncal-sede-b]
type=aor
contact=sip:10.0.0.2:5060

[troncal-sede-b]
type=identify
endpoint=troncal-sede-b
match=10.0.0.2