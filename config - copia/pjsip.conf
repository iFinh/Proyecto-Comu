[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- EXTENSION 1001 (ARTURO) ---
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1001
aors=1001
rtp_timeout_hold=900

[auth1001]
type=auth
auth_type=userpass
password=secreto1001
username=1001

[1001]
type=aor
max_contacts=1

